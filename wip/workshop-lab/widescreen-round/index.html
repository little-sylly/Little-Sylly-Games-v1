<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop Lab</title>
<!-- SANDBOX (wip/workshop-lab). Serve from the repo root (`npx http-server -p 8080` or
     `python -m http.server`) and open /wip/workshop-lab/. Nothing in production loads this.

     <base> points at the repo root ON PURPOSE: js/controller.js resolves its sticker
     manifest and images as 'data/stickers/…' relative to the page, exactly as it does
     from index.html. Every lab-local URL below is therefore written from the root. -->
<base href="../../">
<script src="js/lib/tailwind-play.js"></script>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="wip/workshop-lab/workshop-lab.css">
</head>
<body class="wl-body">

<!-- The room. One design at a time is built into #wl-room by workshop-lab.js. -->
<section id="wl" data-design="bench" aria-label="The Workshop">
  <div id="wl-room"></div>
</section>

<!-- The sandbox's design switcher — floats, so it is never part of any design. -->
<nav class="wl-lab" role="tablist" aria-label="Workshop design (sandbox only)">
  <span class="wl-lab-tag">Sandbox</span>
  <button role="tab" data-design="bench">A · Bench</button>
  <button role="tab" data-design="shop">B · Paint Shop</button>
  <button role="tab" data-design="mat">C · Craft Mat</button>
</nav>

<div class="wl-toast" id="wl-toast" role="status" aria-live="polite"></div>

<!-- Real partials land here (hidden), so every id js/controller.js binds at parse
     time exists. Pieces are then MOVED into the design, listeners and all. -->
<div id="wl-live" hidden></div>
<div id="wl-park" hidden></div>

<script src="js/lib/three.min.js"></script>
<script src="js/lib/controller-body.js"></script>
<script src="wip/workshop-lab/designs.js"></script>
<script src="wip/workshop-lab/workshop-lab.js"></script>
</body>
</html>

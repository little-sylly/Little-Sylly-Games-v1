<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jukebox Lab</title>
<!-- SANDBOX (wip/jukebox-lab). Serve from the repo root, e.g. `npx http-server -p 8080` or
     `python -m http.server`, then open /wip/jukebox-lab/. Nothing in production loads this. -->
<link rel="stylesheet" href="jukebox.css">
</head>
<body>

<section id="screen-jukebox" class="jbx" aria-label="The Jukebox">
  <header class="jbx-head">
    <div>
      <h1 class="jbx-title">The Jukebox</h1>
      <p class="jbx-sub">Pick a record. The cat will sing it.</p>
    </div>
    <div class="jbx-head-tools">
      <div class="jbx-lab" role="tablist" aria-label="Selection design (sandbox only)">
        <span class="jbx-lab-tag">Sandbox</span>
        <button role="tab" data-design="picked">A + B · Picked</button>
        <button role="tab" data-design="shelf">C · Shelf</button>
        <button role="tab" data-design="wallbox">D · Wallbox</button>
      </div>
      <button class="jbx-icon" id="jbx-sound" aria-label="Mute">🔊</button>
      <button class="jbx-icon" id="jbx-close" aria-label="Back to the Lounge">✕</button>
    </div>
  </header>

  <main class="jbx-body">
    <!-- STAGE — the cat jukebox itself, then what it is playing -->
    <div class="jbx-stage">
      <div class="jbx-view">
        <div class="jbx-spot" aria-hidden="true"></div>
        <canvas id="jbx-canvas" aria-label="The cat jukebox. Its five buttons work."></canvas>
        <div class="jbx-nogl" hidden>🐱<span>♪</span></div>
      </div>

      <div class="jbx-deck">
        <div class="jbx-np">
          <div class="jbx-np-art" id="jbx-np-art"></div>
          <div class="jbx-np-text">
            <p class="jbx-np-title" id="jbx-np-title">Nothing on yet</p>
            <p class="jbx-np-meta" id="jbx-np-meta">Pick a record from the right</p>
          </div>
        </div>
        <div class="jbx-scrub">
          <span class="jbx-time" id="jbx-t0">0:00</span>
          <div class="jbx-wave" id="jbx-wave" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
          <span class="jbx-time" id="jbx-t1">0:00</span>
        </div>
        <div class="jbx-transport" role="group" aria-label="Jukebox buttons">
          <button class="jbx-key k-play" data-kind="playpause" aria-label="Play or pause"></button>
          <button class="jbx-key k-prev" data-kind="prev" aria-label="Previous song"></button>
          <button class="jbx-key k-next" data-kind="next" aria-label="Next song"></button>
          <button class="jbx-key k-down" data-kind="down" aria-label="Volume down"></button>
          <button class="jbx-key k-up" data-kind="up" aria-label="Volume up"></button>
        </div>
        <div class="jbx-vol" id="jbx-vol" aria-hidden="true"></div>
      </div>
    </div>

    <!-- SELECTION — one of four designs, swapped by the sandbox tabs above -->
    <div class="jbx-pick" id="jbx-pick"></div>
  </main>
</section>

<details class="jbx-dev">
  <summary>Dev (sandbox)</summary>
  <label><input type="checkbox" id="jbx-dev-locks"> Preview soft-locks (locks every variant track)</label>
</details>
<div class="jbx-toast" id="jbx-toast" role="status" aria-live="polite"></div>
<audio id="jbx-audio" preload="none"></audio>

<script src="../../js/lib/three.min.js"></script>
<script src="../../js/lib/controller-body.js"></script>
<script src="../../js/lobby/lobby-games.js"></script>
<script src="../../js/lounge/lounge-lib.js"></script>
<script src="../../js/lounge/lounge-props.js"></script>
<script src="designs.js"></script>
<script src="jukebox.js"></script>
</body>
</html>

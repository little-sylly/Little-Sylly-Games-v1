<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Little Sylly — Lampshade Greybox</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #14100e;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    background: radial-gradient(120% 90% at 50% 42%, #3a3230 0%, #221c1a 45%, #100d0c 100%);
    touch-action: none; cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  canvas { display: block; }

  #panel {
    position: fixed; top: 14px; right: 14px; width: 234px;
    background: rgba(18,14,13,0.82);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px; color: #ddd6d0; font-size: 11px; z-index: 10;
    max-height: calc(100% - 28px); display: flex; flex-direction: column;
  }
  #panelHead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; letter-spacing: 0.14em; text-transform: uppercase;
    font-size: 9.5px; color: #9d938c;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #toggle {
    background: none; border: 1px solid rgba(255,255,255,0.18);
    color: #ddd6d0; border-radius: 5px; width: 22px; height: 20px;
    line-height: 1; cursor: pointer; font-size: 12px;
  }
  #toggle:focus-visible, .btn:focus-visible { outline: 2px solid #c76b84; outline-offset: 2px; }
  #panelBody { padding: 4px 12px 12px; overflow-y: auto; }
  #panel.closed #panelBody { display: none; }

  .grp { margin-top: 10px; }
  .grp > label {
    display: flex; justify-content: space-between; align-items: baseline;
    letter-spacing: 0.10em; text-transform: uppercase;
    font-size: 9px; color: #9d938c; margin-bottom: 4px;
  }
  .grp > label b { color: #f0e9e4; font-weight: 500; font-size: 10.5px; letter-spacing: 0; }
  input[type=range] { width: 100%; margin: 0; accent-color: #c76b84; height: 16px; }

  .row { display: flex; gap: 6px; margin-top: 12px; }
  .btn {
    flex: 1; padding: 7px 4px; cursor: pointer;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: #ddd6d0; border-radius: 6px;
    letter-spacing: 0.10em; text-transform: uppercase; font-size: 9px;
  }
  .btn:hover { background: rgba(255,255,255,0.12); }
  .btn[aria-pressed="true"] { background: #c76b84; border-color: #c76b84; color: #fff; }

  #readout {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.08);
    color: #8b817b; line-height: 1.65; font-size: 10px;
  }
  #readout b { color: #d8cfc9; font-weight: 500; }

  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: #6f6560; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; pointer-events: none; z-index: 5;
  }
  @media (max-width: 640px) {
    #panel { width: calc(100% - 28px); top: auto; bottom: 14px; right: 14px; }
    #panelBody { max-height: 38vh; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="panel">
  <div id="panelHead">
    <span>Greybox controls</span>
    <button id="toggle" aria-label="Collapse controls">−</button>
  </div>
  <div id="panelBody">
    <div class="grp">
      <label for="panels">Panels around ring <b id="vPanels">8</b></label>
      <input type="range" id="panels" min="6" max="14" step="1" value="8">
    </div>
    <div class="grp">
      <label for="rows">Rows <b id="vRows">3</b></label>
      <input type="range" id="rows" min="2" max="5" step="1" value="3">
    </div>
    <div class="grp">
      <label for="dia">Top diameter <b id="vDia">15.0 cm</b></label>
      <input type="range" id="dia" min="10" max="22" step="0.5" value="15">
    </div>
    <div class="grp">
      <label for="taper">Taper to base <b id="vTaper">0.90</b></label>
      <input type="range" id="taper" min="0.70" max="1.00" step="0.01" value="0.90">
    </div>
    <div class="grp">
      <label for="gapY">Gap between rows <b id="vGapY">0.35 cm</b></label>
      <input type="range" id="gapY" min="0" max="1.2" step="0.05" value="0.35">
    </div>
    <div class="grp">
      <label for="card">Card size <b id="vCard">5.0 cm</b></label>
      <input type="range" id="card" min="3" max="7" step="0.1" value="5">
    </div>
    <div class="grp">
      <label for="sway">Sway <b id="vSway">1.00</b></label>
      <input type="range" id="sway" min="0" max="2.5" step="0.05" value="1.0">
    </div>
    <div class="grp">
      <label for="bulbY">Bulb height <b id="vBulbY">14.9 cm</b></label>
      <input type="range" id="bulbY" min="9" max="20" step="0.1" value="14.9">
    </div>
    <div class="grp">
      <label for="bulb">Bulb brightness <b id="vBulb">2.4</b></label>
      <input type="range" id="bulb" min="0" max="6" step="0.1" value="2.4">
    </div>
    <div class="grp">
      <label for="glow">Photo glow <b id="vGlow">1.00</b></label>
      <input type="range" id="glow" min="0" max="2" step="0.05" value="1.0">
    </div>
    <div class="grp">
      <label for="filmOp">Film transparency <b id="vFilmOp">0.82</b></label>
      <input type="range" id="filmOp" min="0.35" max="1" step="0.01" value="0.82">
    </div>
    <div class="grp">
      <label for="room">Room light <b id="vRoom">0.30</b></label>
      <input type="range" id="room" min="0" max="1.5" step="0.05" value="0.30">
    </div>
    <div class="row">
      <button class="btn" id="lampBtn" aria-pressed="true">Lamp on</button>
      <button class="btn" id="resetBtn">Reset</button>
    </div>
    <div id="readout">
      Gap at top <b id="vGapTop">0.89 cm</b><br>
      Gap at base <b id="vGapBot">0.30 cm</b><br>
      Photo slots <b id="vSlots">24</b> · Height <b id="vHeight">24.2 cm</b>
    </div>
  </div>
</div>

<div id="hint">Drag to spin</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  // ---------------- procedural textures ----------------
  function woodTexture() {
    var c = document.createElement("canvas");
    c.width = 512; c.height = 512;
    var x = c.getContext("2d");
    x.fillStyle = "#d9b184"; x.fillRect(0, 0, 512, 512);
    // broad tonal banding
    for (var b = 0; b < 26; b++) {
      var y0 = Math.random() * 512;
      var h = 6 + Math.random() * 26;
      x.fillStyle = "rgba(158,110,66," + (0.03 + Math.random() * 0.05) + ")";
      x.fillRect(0, y0, 512, h);
    }
    // fine grain lines with a gentle wobble
    for (var i = 0; i < 190; i++) {
      var y = Math.random() * 512;
      var amp = 1 + Math.random() * 5;
      var period = 90 + Math.random() * 200;
      x.strokeStyle = "rgba(120,78,44," + (0.05 + Math.random() * 0.22) + ")";
      x.lineWidth = 0.5 + Math.random() * 1.4;
      x.beginPath();
      for (var px = 0; px <= 512; px += 8) {
        var py = y + Math.sin((px / period) * Math.PI * 2 + i) * amp;
        if (px === 0) x.moveTo(px, py); else x.lineTo(px, py);
      }
      x.stroke();
    }
    // pores
    for (var p = 0; p < 900; p++) {
      x.fillStyle = "rgba(103,66,38,0.16)";
      x.fillRect(Math.random() * 512, Math.random() * 512, 1.6, 0.9);
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }

    // the stippled, orange-peel paint finish on the cards

    x.fillStyle = "#808080"; x.fillRect(0, 0, 256, 256);

    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(3, 3);
    return t;
  }

        x.fillRect(cx - 8, cy - 8, 16, 16);
        x.fillStyle = "rgba(255,240,190,0.55)";
        x.fillRect(cx - 5, cy - 5, 10, 10);
      }
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;

  });
  var matGold = new THREE.MeshStandardMaterial({ color: 0xc9a44a, roughness: 0.30, metalness: 0.85 });
  var matSocket = new THREE.MeshStandardMaterial({ color: 0xbdb9b4, roughness: 0.72, metalness: 0.05 });
  var matChrome = new THREE.MeshStandardMaterial({ color: 0xd8dade, roughness: 0.16, metalness: 0.92 });

  // ---------------- static: base, stem, contact shadow ----------------
  var base = new THREE.Mesh(new THREE.CylinderGeometry(BASE_R, BASE_R * 0.985, BASE_H, 72), matWood);
  base.position.y = BASE_H / 2; scene.add(base);

  var stemH = 6.6;
  var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.92, stemH, 28), matWood);
  stem.position.y = BASE_H + stemH / 2; scene.add(stem);

  scene.add(makeContactShadow());
  function makeContactShadow() {
    var c = document.createElement("canvas"); c.width = c.height = 256;
    var x = c.getContext("2d");
    var g = x.createRadialGradient(128, 128, 8, 128, 128, 126);
    g.addColorStop(0, "rgba(0,0,0,0.62)");
    g.addColorStop(0.45, "rgba(0,0,0,0.26)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    var m = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })
    );
    m.rotation.x = -Math.PI / 2; m.position.y = 0.01;
    return m;
  }

  // ---------------- the bulb assembly ----------------
  var bulbRig = new THREE.Group();
  scene.add(bulbRig);
  (function buildBulb() {
    var cup = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 0.85, 1.25, 28), matChrome);
    cup.position.y = -3.35; bulbRig.add(cup);

    var collar = new THREE.Mesh(new THREE.CylinderGeometry(1.32, 1.32, 0.28, 28), matSocket);
    collar.position.y = -2.66; bulbRig.add(collar);

    var socket = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.98, 1.35, 28), matSocket);
    socket.position.y = -1.85; bulbRig.add(socket);

    var gold = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.65, 28), matGold);
    gold.position.y = -0.9; bulbRig.add(gold);

    var tube = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.92, 4.4, 30, 1, true), matTube);
    tube.position.y = 1.5; bulbRig.add(tube);

    var capTop = new THREE.Mesh(new THREE.SphereGeometry(0.92, 24, 10, 0, Math.PI * 2, 0, Math.PI / 2), matTube);
    capTop.position.y = 3.7; bulbRig.add(capTop);
  })();

  var glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTexture(), color: 0xffc27a,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
  }));
  glow.scale.set(15, 15, 1); scene.add(glow);

  function makeGlowTexture() {
    var c = document.createElement("canvas"); c.width = c.height = 128;
    var x = c.getContext("2d");
    var g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, "rgba(255,225,180,0.85)");
    g.addColorStop(0.30, "rgba(255,190,120,0.30)");
    g.addColorStop(1, "rgba(255,170,90,0)");
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  // ---------------- the shade ----------------
  var spinGroup = new THREE.Group();
  scene.add(spinGroup);
  var columns = [];   // per-column chain of hinged links, for the sway

  function disposeGroup(group) {
    for (var i = group.children.length - 1; i >= 0; i--) {
      var ch = group.children[i];
      if (ch.geometry) ch.geometry.dispose();
      group.remove(ch);
    }
  }

  function cardGeometry(w, h, ww, wh, t) {
    var s = new THREE.Shape();
    s.moveTo(-w / 2, -h / 2); s.lineTo(w / 2, -h / 2);
    s.lineTo(w / 2, h / 2); s.lineTo(-w / 2, h / 2); s.lineTo(-w / 2, -h / 2);
    var hole = new THREE.Path();
    hole.moveTo(-ww / 2, -wh / 2); hole.lineTo(-ww / 2, wh / 2);
    hole.lineTo(ww / 2, wh / 2); hole.lineTo(ww / 2, -wh / 2); hole.lineTo(-ww / 2, -wh / 2);
    s.holes.push(hole);
    var g = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 1 });
    g.translate(0, 0, -t / 2);
    return g;
  }

  function buildShade() {
    disposeGroup(spinGroup);

    var n = CFG.panels, rows = CFG.rows;
    var cw = CFG.card, ch = CFG.card;
    var ww = cw * WIN_W_RATIO, wh = ch * WIN_H_RATIO;
    var thick = 0.20;          // 2mm card stock
    var gapY = CFG.gapY;       // cards hang separately, they don't touch

    var Rtop = CFG.diameter / 2;
    var Rbot = Rtop * CFG.taper;
    var pitch = ch + gapY;
    var shadeH = rows * ch + (rows - 1) * gapY;
    var shadeTop = SHADE_BOTTOM + shadeH;
    var tilt = Math.atan((Rtop - Rbot) / shadeH);

    function radiusAt(y) {
      var f = (shadeTop - y) / shadeH;
      return Rtop + (Rbot - Rtop) * f;
    }

    // The cage is only two hoops: one at the top that everything hangs from,
    // and a lower one the cards overhang past by ~1cm. Nothing in the middle.
    var OVERHANG = 1.0;
    var hoopBottomY = SHADE_BOTTOM + OVERHANG;
    var hoopYs = [shadeTop, hoopBottomY];
    for (var hi = 0; hi < hoopYs.length; hi++) {
      var hy = hoopYs[hi];
      var hoop = new THREE.Mesh(new THREE.TorusGeometry(radiusAt(hy), 0.075, 6, 80), matWire);
      hoop.rotation.x = Math.PI / 2;
      hoop.position.y = hy;
      spinGroup.add(hoop);
    }

    // Four uprights only — one every second card junction.
    var postSpan = shadeTop - hoopBottomY;
    var postMidY = (shadeTop + hoopBottomY) / 2;
    var postGeo = new THREE.CylinderGeometry(0.06, 0.06, postSpan / Math.cos(tilt), 6);
    var midR = radiusAt(postMidY);
    for (var v = 0; v < n; v += 2) {
      var va = (v + 0.5) * (Math.PI * 2 / n);
      var post = new THREE.Mesh(postGeo, matWire);
      post.rotation.order = "YXZ";
      post.rotation.y = va;
      post.rotation.x = tilt;
      post.position.set(Math.sin(va) * midR, postMidY, Math.cos(va) * midR);
      spinGroup.add(post);
    }

    var cardGeo = cardGeometry(cw, ch, ww, wh, thick);
    var filmGeo = new THREE.PlaneGeometry(ww * 1.03, wh * 1.03);
    var ringGeo = new THREE.TorusGeometry(0.19, 0.045, 5, 14);

    // the film sits against the BACK of the card, so ~1.7mm of frame stands
    // proud of it — real inner wall, real parallax as it turns
    var filmInset = thick / 2 - 0.03;
    var halfW = cw / 2 - 0.42;

    columns = [];

    for (var i = 0; i < n; i++) {
      var a = i * (Math.PI * 2 / n);

      // Column pivot: sits at the top hoop, where this stack actually hangs from.
      // Tilting it here produces the cone, so every card below just hangs straight.
      var col = new THREE.Group();
      col.rotation.order = "YXZ";
      col.rotation.y = a;
      col.rotation.x = tilt;
      col.position.set(Math.sin(a) * Rtop, shadeTop, Math.cos(a) * Rtop);
      spinGroup.add(col);

      var links = [];
      var parent = col;

      for (var row = 0; row < rows; row++) {
        // one hinge per card — the joint the rings form with the card above
        var link = new THREE.Group();
        link.position.y = (row === 0) ? 0 : -pitch;
        parent.add(link);
        links.push(link);
        parent = link;

        var card = new THREE.Mesh(cardGeo, matCard);
        card.position.y = -ch / 2;
        link.add(card);

        var slot = row * n + i;
        var film = new THREE.Mesh(filmGeo, filmMats[slot % filmMats.length]);
        film.position.set(0, -ch / 2, -filmInset);
        film.renderOrder = 1;
        link.add(film);

        // Two rings per card, at its TOP corners only. Row 0's pair threads onto
        // the top hoop; the others are the shared joint with the card above.
        // Nothing hangs off the bottom card.
        var ringY = (row === 0) ? -0.10 : gapY / 2;
        for (var sx = -1; sx <= 1; sx += 2) {
          var ring = new THREE.Mesh(ringGeo, matRing);
          ring.rotation.y = Math.PI / 2;
          ring.position.set(halfW * sx, ringY, 0.10);
          link.add(ring);
        }
      }

      columns.push(links);
    }

    positionBulb();
    frameCamera(shadeTop);
    updateReadout(Rtop, Rbot, n, rows, cw, shadeTop);
  }

  function positionBulb() {
    bulbRig.position.set(0, CFG.bulbY, 0);
    bulbLight.position.set(0, CFG.bulbY + 1.5, 0);
    glow.position.set(0, CFG.bulbY + 1.5, 0);
  }

  function frameCamera(shadeTop) {
    var dist = CFG.diameter * 2.5 + 16;
    camera.position.set(dist * 0.28, shadeTop * 0.78, dist);
    camera.lookAt(0, (SHADE_BOTTOM + shadeTop) / 2 - 0.5, 0);
  }

  function fmtGap(g) { return g >= 0 ? g.toFixed(2) + " cm" : "overlap " + Math.abs(g).toFixed(2); }

  function updateReadout(Rtop, Rbot, n, rows, cw, shadeTop) {
    document.getElementById("vGapTop").textContent = fmtGap((2 * Math.PI * Rtop) / n - cw);
    document.getElementById("vGapBot").textContent = fmtGap((2 * Math.PI * Rbot) / n - cw);
    document.getElementById("vSlots").textContent = n * rows;
    document.getElementById("vHeight").textContent = (shadeTop + 0.2).toFixed(1) + " cm";
  }

  // ---------------- lighting state ----------------
  function applyLighting() {
    var on = CFG.lampOn;
    bulbLight.intensity = on ? CFG.bulb : 0;
    var fe = on ? (0.16 + CFG.bulb * 0.21) * CFG.glow : 0.03;
    for (var fi = 0; fi < filmMats.length; fi++) {
      filmMats[fi].emissiveIntensity = fe;
      filmMats[fi].emissive.setHex(on ? 0xffe0bb : 0xffffff);
      filmMats[fi].opacity = CFG.filmOp;
    }
    matTube.emissiveIntensity = on ? 0.75 + CFG.bulb * 0.30 : 0.02;
    glow.visible = on;
    glow.material.opacity = Math.min(1, CFG.bulb / 3.2);
    keyLight.intensity = CFG.room;
    fillLight.intensity = CFG.room * 0.55;
    ambient.intensity = 0.12 + CFG.room * 0.30;
  }

  // ---------------- spin ----------------
  var rotation = 0, velocity = 0, prevVelocity = 0;
  var SWAY_STIFF = 0.055, SWAY_DAMP = 0.13, SWAY_MAX = 0.10;
  var IDLE = reduceMotion ? 0 : 0.0016;
  var dragging = false, lastX = 0, lastT = 0;

  stage.addEventListener("pointerdown", function (e) {
    dragging = true; stage.classList.add("dragging");
    lastX = e.clientX; lastT = performance.now();
    if (stage.setPointerCapture) stage.setPointerCapture(e.pointerId);
  });
  window.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var now = performance.now();
    var dx = e.clientX - lastX;
    var dt = Math.max(now - lastT, 8);
    rotation += dx * 0.0075;
    velocity = (dx * 0.0075) * (16 / dt);
    lastX = e.clientX; lastT = now;
  });
  function up() { dragging = false; stage.classList.remove("dragging"); }
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);

  // ---------------- loop ----------------
  var running = true;
  document.addEventListener("visibilitychange", function () {
    running = !document.hidden;
    if (running) tick();
  });

  function tick() {
    if (!running) return;
    requestAnimationFrame(tick);
    if (!dragging) {
      velocity *= 0.955;
      if (Math.abs(velocity) < IDLE) velocity += (IDLE - velocity) * 0.02;
      rotation += velocity;
    }
    spinGroup.rotation.y = rotation;

    // Each card is a damped spring hinged off the one above it. The forcing term
    // is the shade's angular ACCELERATION, so a steady idle spin sits perfectly
    // still and only a flick or a hard stop makes the stack lag and settle.
    var accel = velocity - prevVelocity;
    prevVelocity = velocity;
    if (!reduceMotion) {
      for (var c = 0; c < columns.length; c++) {
        var links = columns[c];
        for (var k = 0; k < links.length; k++) {
          var L = links[k];
          if (L.userData.phi === undefined) { L.userData.phi = 0; L.userData.vel = 0; }
          var drive = -accel * 0.13 * (k + 1) * CFG.sway;
          var acc = -SWAY_STIFF * L.userData.phi - SWAY_DAMP * L.userData.vel + drive;
          L.userData.vel += acc;
          L.userData.phi += L.userData.vel;
          if (L.userData.phi > SWAY_MAX) { L.userData.phi = SWAY_MAX; L.userData.vel *= 0.4; }
          if (L.userData.phi < -SWAY_MAX) { L.userData.phi = -SWAY_MAX; L.userData.vel *= 0.4; }
          L.rotation.z = L.userData.phi;
        }
      }
    }

    renderer.render(scene, camera);
  }

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  // ---------------- controls ----------------
  function bind(id, key, fmt, rebuild, onlyBulb) {
    var el = document.getElementById(id);
    var out = document.getElementById("v" + id.charAt(0).toUpperCase() + id.slice(1));
    function sync() {
      CFG[key] = parseFloat(el.value);
      out.textContent = fmt(CFG[key]);
      if (rebuild) buildShade();
      else if (onlyBulb) positionBulb();
      applyLighting();
    }
    el.addEventListener("input", sync);
    sync();
  }

  bind("panels", "panels", function (v) { return v; }, true);
  bind("rows", "rows", function (v) { return v; }, true);
  bind("dia", "diameter", function (v) { return v.toFixed(1) + " cm"; }, true);
  bind("taper", "taper", function (v) { return v.toFixed(2); }, true);
  bind("sway", "sway", function (v) { return v.toFixed(2); }, false);
  bind("gapY", "gapY", function (v) { return v.toFixed(2) + " cm"; }, true);
  bind("card", "card", function (v) { return v.toFixed(1) + " cm"; }, true);
  bind("bulbY", "bulbY", function (v) { return v.toFixed(1) + " cm"; }, false, true);
  bind("bulb", "bulb", function (v) { return v.toFixed(1); }, false);
  bind("glow", "glow", function (v) { return v.toFixed(2); }, false);
  bind("filmOp", "filmOp", function (v) { return v.toFixed(2); }, false);
  bind("room", "room", function (v) { return v.toFixed(2); }, false);

  var lampBtn = document.getElementById("lampBtn");
  lampBtn.addEventListener("click", function () {
    CFG.lampOn = !CFG.lampOn;
    lampBtn.setAttribute("aria-pressed", String(CFG.lampOn));
    lampBtn.textContent = CFG.lampOn ? "Lamp on" : "Lamp off";
    applyLighting();
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    rotation = 0; velocity = 0; buildShade();
  });

  var panel = document.getElementById("panel");
  var toggle = document.getElementById("toggle");
  toggle.addEventListener("click", function () {
    panel.classList.toggle("closed");
    toggle.textContent = panel.classList.contains("closed") ? "+" : "−";
  });

  resize();
  buildShade();
  applyLighting();
  tick();
})();
</script>
</body>
</html>

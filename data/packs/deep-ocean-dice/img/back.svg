<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="faceGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2A5FA8"/>
      <stop offset="100%" stop-color="#0E1F3D"/>
    </radialGradient>
    <radialGradient id="innerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3F7A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="glyphGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F5D98A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C8A84B" stop-opacity="0.25"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Die face -->
  <rect x="20" y="20" width="560" height="560" rx="80" ry="80" fill="url(#faceGrad)"/>

  <!-- Inner depth vignette -->
  <rect x="20" y="20" width="560" height="560" rx="80" ry="80" fill="url(#innerGrad)"/>

  <!-- Outer border -->
  <rect x="20" y="20" width="560" height="560" rx="80" ry="80"
        fill="none" stroke="#3A72C0" stroke-width="3" opacity="0.6"/>
  <!-- Inner border -->
  <rect x="32" y="32" width="536" height="536" rx="70" ry="70"
        fill="none" stroke="#4A85D8" stroke-width="1.5" opacity="0.3"/>

  <!-- Diamond pattern - subtle crosshatch of thin lines -->
  <g opacity="0.12" stroke="#A8C8F0" stroke-width="1.2" fill="none">
    <!-- Diagonal lines NW→SE -->
    <line x1="20" y1="180" x2="180" y2="20"/>
    <line x1="20" y1="300" x2="300" y2="20"/>
    <line x1="20" y1="420" x2="420" y2="20"/>
    <line x1="20" y1="540" x2="540" y2="20"/>
    <line x1="60" y1="580" x2="580" y2="60"/>
    <line x1="180" y1="580" x2="580" y2="180"/>
    <line x1="300" y1="580" x2="580" y2="300"/>
    <line x1="420" y1="580" x2="580" y2="420"/>
    <line x1="540" y1="580" x2="580" y2="540"/>
    <!-- Diagonal lines NE→SW -->
    <line x1="420" y1="20" x2="20" y2="420"/>
    <line x1="540" y1="20" x2="20" y2="540"/>
    <line x1="580" y1="60" x2="60" y2="580"/>
    <line x1="580" y1="180" x2="180" y2="580"/>
    <line x1="580" y1="300" x2="300" y2="580"/>
    <line x1="580" y1="420" x2="420" y2="580"/>
    <line x1="300" y1="20" x2="20" y2="300"/>
    <line x1="180" y1="20" x2="20" y2="180"/>
    <line x1="580" y1="540" x2="540" y2="580"/>
  </g>

  <!-- Central cliff/mountain glyph — a simple upward chevron, the "summit" motif -->
  <g filter="url(#outerGlow)">
    <polygon points="300,170 430,370 170,370"
             fill="none" stroke="url(#glyphGrad)" stroke-width="3.5"
             stroke-linejoin="round" opacity="0.5"/>
  </g>
  <g filter="url(#softGlow)">
    <polygon points="300,210 400,380 200,380"
             fill="none" stroke="url(#glyphGrad)" stroke-width="2.5"
             stroke-linejoin="round" opacity="0.7"/>
  </g>
  <!-- Peak dot -->
  <circle cx="300" cy="170" r="10" fill="url(#glyphGrad)" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Horizon line below glyph -->
  <line x1="155" y1="415" x2="445" y2="415"
        stroke="#C8A84B" stroke-width="1.5" opacity="0.25"/>
</svg>

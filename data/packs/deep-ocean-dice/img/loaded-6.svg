<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="faceGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#B4801E"/>
      <stop offset="100%" stop-color="#5A3C08"/>
    </radialGradient>
    <radialGradient id="pipGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFF0C0"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <filter id="pipGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Die face -->
  <rect x="20" y="20" width="560" height="560" rx="80" ry="80" fill="url(#faceGrad)"/>

  <!-- Inner border glow -->
  <rect x="20" y="20" width="560" height="560" rx="80" ry="80"
        fill="none" stroke="#3A72C0" stroke-width="3" opacity="0.6"/>
  <rect x="32" y="32" width="536" height="536" rx="70" ry="70"
        fill="none" stroke="#4A85D8" stroke-width="1.5" opacity="0.3"/>

  <!-- Left column -->
  <circle cx="195" cy="165" r="52" fill="url(#pipGrad)" filter="url(#pipGlow)"/>
  <circle cx="195" cy="300" r="52" fill="url(#pipGrad)" filter="url(#pipGlow)"/>
  <circle cx="195" cy="435" r="52" fill="url(#pipGrad)" filter="url(#pipGlow)"/>

  <!-- Right column -->
  <circle cx="405" cy="165" r="52" fill="url(#pipGrad)" filter="url(#pipGlow)"/>
  <circle cx="405" cy="300" r="52" fill="url(#pipGrad)" filter="url(#pipGlow)"/>
  <circle cx="405" cy="435" r="52" fill="url(#pipGrad)" filter="url(#pipGlow)"/>
</svg>

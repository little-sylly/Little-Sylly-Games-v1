<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="faceGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#12704F"/>
      <stop offset="100%" stop-color="#042A20"/>
    </radialGradient>
    <radialGradient id="pipGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#B8F5CE"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </radialGradient>
    <filter id="pipGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Die face -->
  <rect x="20" y="20" width="560" height="560" rx="80" ry="80" fill="url(#faceGrad)"/>

  <!-- Inner border glow -->
  <rect x="20" y="20" width="560" height="560" rx="80" ry="80"
        fill="none" stroke="#3A72C0" stroke-width="3" opacity="0.6"/>
  <rect x="32" y="32" width="536" height="536" rx="70" ry="70"
        fill="none" stroke="#4A85D8" stroke-width="1.5" opacity="0.3"/>

  <!-- Pip: top-left -->
  <rect x="-44" y="-44" width="88" height="88" rx="10" fill="url(#pipGrad)"
        filter="url(#pipGlow)" transform="translate(195 195) rotate(45)"/>
  <!-- Pip: top-right -->
  <rect x="-44" y="-44" width="88" height="88" rx="10" fill="url(#pipGrad)"
        filter="url(#pipGlow)" transform="translate(405 195) rotate(45)"/>
  <!-- Pip: bottom-left -->
  <rect x="-44" y="-44" width="88" height="88" rx="10" fill="url(#pipGrad)"
        filter="url(#pipGlow)" transform="translate(195 405) rotate(45)"/>
  <!-- Pip: bottom-right -->
  <rect x="-44" y="-44" width="88" height="88" rx="10" fill="url(#pipGrad)"
        filter="url(#pipGlow)" transform="translate(405 405) rotate(45)"/>
</svg>

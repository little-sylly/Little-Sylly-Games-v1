  <!-- ═══════════════════════════════════════════════════════════════
       SECRET MODE
       Screens : #screen-secret-gateway, #screen-secret-terminal
       Overlays: #gm-vocab-overlay (word list, terminal style)
       Ref     : js/secret-mode.js
  ════════════════════════════════════════════════════════════════ -->
  <section id="screen-secret-gateway" style="display:none"
    class="relative flex flex-col items-center justify-center w-full min-h-screen bg-black px-4 py-8 font-mono">

    <!-- Exit — in normal flow, not absolute: the screen centres its content as
         one vertical group, so an absolutely-positioned button pinned to the
         literal viewport corner leaves a large gap above the (shorter,
         centred) header below it. As a flow sibling it always sits directly
         above the header, wherever that group ends up centring. -->
    <div class="w-full max-w-sm flex justify-end mb-1">
      <button id="sm-btn-exit"
        class="text-green-400 text-xl active:scale-90 transition-transform duration-100 min-h-11 min-w-11">✕</button>
    </div>

    <!-- Header + stream — ONE bordered frame. The rule lines below are
         CSS-drawn (a diagonal-hash gradient, a double border, a dashed
         border) rather than counted ASCII characters — a fixed string of
         slashes/equals/dashes only reaches the container edge by luck at
         one specific viewport+font combination and falls short or overruns
         at every other one. A CSS rule always spans exactly 100%. The
         dashed side rails wrap header AND stream as one box, so they run
         the full height the comment always claimed. -->
    <div class="w-full max-w-sm text-green-400 select-none font-mono mb-5
      border-l-2 border-r-2 border-dashed border-green-400/25">
      <div class="px-2">
        <div class="sm-gw-rule-hash h-[3px]"></div>
        <div class="border-t border-double border-green-400/30 mt-0.5"></div>

        <!-- stat box -->
        <div class="border-l border-r border-green-400/30 px-2 py-1 my-0.5 flex flex-col gap-0.5 text-[8px] tracking-wide opacity-70">
          <div class="flex items-center justify-between">
            <span>SYLLY-OS v1.0</span><span>LINK OK</span>
          </div>
          <div class="flex items-center justify-between">
            <span id="sm-gateway-stat1"></span><span id="sm-gateway-stat2"></span>
          </div>
        </div>

        <div class="border-t border-double border-green-400/30"></div>

        <!-- dotted-corner title box -->
        <div class="flex items-center justify-between text-[10px] opacity-40 tracking-tighter mt-1 leading-none">
          <span>......</span><span>......</span>
        </div>
        <div class="text-center py-1">
          <div class="text-lg font-bold tracking-[0.25em]">[ SYLLY GATEWAY ]</div>
          <div class="text-[9px] tracking-widest opacity-50 mt-0.5">// CLASSIFIED ACCESS</div>
        </div>
        <div class="flex items-center justify-between text-[10px] opacity-40 tracking-tighter leading-none">
          <span>......</span><span>......</span>
        </div>

        <div class="border-t border-dashed border-green-400/50 mt-0.5"></div>

        <div class="text-center text-[10px] tracking-widest opacity-70 py-1">&gt; <span id="sm-gateway-timestamp"></span> &lt;</div>
      </div>

      <!-- The loadout stream — same frame, same inset, so its edges are the
           header's edges, not a narrower box floating inside them -->
      <div id="sm-gateway-log"
        class="sm-gateway-blur px-2 py-1 h-64 overflow-hidden text-green-400/90 text-[10px] leading-[1.35] tracking-wide select-none"></div>
    </div>

    <!-- Resolution + tap-to-continue. Waits for a tap rather than auto-advancing:
         a slow phone must not let the payoff scroll past before it is read. -->
    <div id="sm-gateway-granted" style="display:none"
      class="mt-5 flex flex-col items-center gap-3">
      <div class="text-green-400 text-base font-bold tracking-[0.2em]">[ ACCESS GRANTED ]</div>
      <button id="sm-gateway-continue"
        class="text-xs font-mono px-4 py-3 border-2 border-green-400 text-green-400 rounded active:scale-95 transition-transform duration-75 min-h-11">TAP TO CONTINUE</button>
    </div>
  </section>

  <!-- ══ SECRET TERMINAL — Sylly-OS launcher ══ -->
  <section id="screen-secret-terminal" style="display:none"
    class="relative flex flex-col w-full min-h-screen bg-black px-4 pt-5 pb-6 font-mono">

    <!-- Header bar — sticky: smSelectGame() scrolls this section to the bottom to reveal
         the Launch button, which would otherwise carry the only ← BACK off-screen with it. -->
    <div class="sticky top-0 z-10 bg-black flex items-center justify-between mb-5 flex-shrink-0 pb-2">
      <div class="text-green-400 text-xs tracking-widest opacity-60 select-none">SYLLY-OS v1.0 // CLASSIFIED</div>
      <button id="sm-terminal-back"
        class="text-green-400 text-xs border border-green-800 rounded px-3 py-1 active:scale-90 transition-transform duration-100 min-h-11 min-w-11 flex items-center justify-center">
        ← BACK
      </button>
    </div>

    <!-- Typewriter log output -->
    <div id="sm-terminal-log"
      class="text-green-400 text-xs leading-6 tracking-wide space-y-0 mb-4 flex-shrink-0"></div>

    <!-- Expansion selector — revealed after boot sequence -->
    <div id="sm-terminal-expansions" style="display:none" class="mb-4 flex-shrink-0"></div>

    <!-- Generation/sub-category selector — revealed after expansion chosen (Pokémon etc.) -->
    <div id="sm-terminal-subcategories" style="display:none" class="mb-4 flex-shrink-0"></div>

    <!-- Game selector — revealed after expansion chosen -->
    <div id="sm-terminal-games" style="display:none" class="mb-4 flex-shrink-0"></div>

    <!-- Launch button — revealed after game chosen -->
    <div id="sm-terminal-launch-wrap" style="display:none" class="mt-2 flex-shrink-0 flex flex-col gap-2">
      <button id="sm-terminal-launch-back"
        class="w-full text-left text-xs font-mono px-3 py-2 text-green-600 active:scale-95 transition-transform duration-75 min-h-11">
        [←] BACK
      </button>
      <button id="sm-terminal-launch"
        class="w-full min-h-14 rounded border-2 border-green-400 text-green-400 text-sm font-bold tracking-widest active:scale-95 transition-transform duration-100">
        [ LAUNCH SEQUENCE ]
      </button>
    </div>

    <!-- Decorative footer -->
    <div class="mt-auto pt-6 text-green-900 text-xs text-center tracking-widest select-none flex-shrink-0">
      SYLLY-OS © CLASSIFIED // AUTHORISED PERSONNEL ONLY
    </div>
  </section>

  <!-- ══ ARCADE CABINET 01 — ASHERPLANE ══ -->
  <section id="screen-arcade-asherplane" style="display:none"
    class="relative flex flex-col w-full h-screen bg-black font-mono overflow-hidden">
    <div class="flex items-center justify-between px-4 pt-3 pb-2 flex-shrink-0">
      <div class="text-green-400 text-xs tracking-widest opacity-60 select-none">ASHERPLANE</div>
      <div class="flex items-center gap-2">
        <button class="btn-open-sound text-xl text-green-400 active:scale-90 transition-transform duration-100 min-h-11 min-w-11">🔊</button>
        <button id="btn-ap-exit" class="text-green-400 text-lg font-bold active:scale-90 transition-transform duration-100 min-h-11 min-w-11">✕</button>
      </div>
    </div>
    <div id="ap-stage" class="flex-1 min-h-0 flex items-center justify-center" style="touch-action:none">
      <canvas id="ap-canvas" class="block"></canvas>
    </div>
  </section>

  <!-- ss-help-tip-overlay (decision modal z-[90] — contextual help) -->
  <div id="ss-help-tip-overlay" style="display:none" class="fixed inset-0 bg-black/40 z-[90] flex items-center justify-center px-6">
    <div class="overlay-modal-inner bg-stone-50 w-full max-w-sm rounded-3xl px-6 pt-6 pb-8 flex flex-col gap-4 text-center border border-teal-300">
      <p id="ss-help-tip-emoji" class="text-4xl"></p>
      <h3 id="ss-help-tip-heading" class="text-lg font-bold text-stone-800"></h3>
      <p id="ss-help-tip-text" class="text-stone-500 text-sm"></p>
      <button id="btn-ss-help-tip-close" class="min-h-12 w-full rounded-xl bg-stone-700 hover:bg-stone-800 active:scale-95 text-white text-base font-semibold transition-all duration-150">
        Got it ✓
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
       LOBBY LAYOUTS (SW v231)
       Screens : #screen-lounge, #screen-tv, #screen-shelves
                 (the fourth layout, Original, is #screen-lobby in _shell.html)
                 #screen-jukebox — not a layout: the Lounge's jukebox door (SW v233)
       Overlays: #lobby-switcher-overlay, #stickerbook-overlay
       Ref     : js/lobby/lobby-host.js (every effect), js/lobby/lobby-router.js (the rules)
       Visibility is showScreen()'s inline style.display — never `hidden` (BUG-19).
  ════════════════════════════════════════════════════════════════ -->
  <!-- THE BOOT SCREEN (SW v252) — shown from first paint, lifted by lobbyVeilFinish
       (lobby-host.js) once the content is in, the room is built and its pictures have
       landed, and never before 2 s. It then waits for a tap ("Come on in"): the browser will not start audio before one, so that tap is also what starts the Lounge's music. Not a screen: it is not in allScreens[], so no
       showScreen() touches it. Styles: css/lobby.css § The boot screen. -->
  <div id="lobby-veil" role="status" aria-label="Loading Little Sylly Games">
    <div class="sylly-wordmark lbv-mark" aria-hidden="true"><span class="sylly-wordmark-a">Little Sylly</span><span class="sylly-wordmark-b">Games</span></div>
    <div class="lbv-bar" aria-hidden="true"><i class="lbv-fill"></i></div>
    <p class="lbv-line" aria-hidden="true"></p>
    <button type="button" class="lbv-go" id="lbv-go">Come on in</button>
  </div>

  <section id="screen-lounge" style="display:none">
    <div id="lou-stage">
      <canvas id="lou-canvas" tabindex="0" aria-label="Little Sylly's lounge. Tab through the room, Enter to use a thing."></canvas>
      <div id="lou-vignette"></div>
      <div id="lou-hud">
        <div id="lou-status" role="status" aria-live="polite"></div>
        <div id="lou-focus"></div>
      </div>
      <div id="lou-fade"></div>
    </div>
  </section>

  <section id="screen-tv" style="display:none"><div id="tv-app"></div></section>

  <section id="screen-shelves" style="display:none"><div id="shelves-canvas"></div></section>

  <!-- THE JUKEBOX (SW v233) — the cat's door in the Lounge, and the 🎵 place in
       Shelves and Classic (SW v238). js/lobby/jukebox.js owns
       everything inside; the ✕ goes back through the router (lobby-host.js), never
       showScreen. Styles: css/jukebox.css, all scoped under #screen-jukebox. -->
  <section id="screen-jukebox" class="jbx" style="display:none" aria-label="The Jukebox">
    <header class="jbx-head">
      <div>
        <h1 class="jbx-title">The Jukebox</h1>
        <p class="jbx-sub">Pick a record. The cat will sing it.</p>
      </div>
      <div class="jbx-head-tools">
        <button class="btn-open-sound jbx-icon" aria-label="Sound">🔊</button>
        <button class="jbx-icon" id="jbx-close" aria-label="Close the jukebox">✕</button>
      </div>
    </header>

    <main class="jbx-body">
      <!-- STAGE — the cat jukebox itself, then what it is playing -->
      <div class="jbx-stage">
        <div class="jbx-view">
          <div class="jbx-spot" aria-hidden="true"></div>
          <canvas id="jbx-canvas" aria-label="The cat jukebox. Its five buttons work."></canvas>
          <div class="jbx-nogl" id="jbx-nogl" hidden>🐱<span>♪</span></div>
        </div>

        <div class="jbx-deck">
          <div class="jbx-np">
            <div class="jbx-np-art" id="jbx-np-art"></div>
            <div class="jbx-np-text">
              <p class="jbx-np-title" id="jbx-np-title">Nothing on yet</p>
              <p class="jbx-np-meta" id="jbx-np-meta">Pick a record — or tap the cat’s yellow button</p>
            </div>
          </div>
          <div class="jbx-scrub">
            <span class="jbx-time" id="jbx-t0">0:00</span>
            <div class="jbx-wave idle" id="jbx-wave" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            <span class="jbx-time" id="jbx-t1">0:00</span>
          </div>
          <div class="jbx-transport" role="group" aria-label="Jukebox buttons">
            <button class="jbx-key k-play" data-kind="playpause" aria-label="Play or pause"></button>
            <button class="jbx-key k-prev" data-kind="prev" aria-label="Previous song"></button>
            <button class="jbx-key k-next" data-kind="next" aria-label="Next song"></button>
            <button class="jbx-key k-down" data-kind="down" aria-label="Volume down"></button>
            <button class="jbx-key k-up" data-kind="up" aria-label="Volume up"></button>
          </div>
          <div class="jbx-vol" id="jbx-vol" aria-hidden="true"></div>
        </div>
      </div>

      <!-- SELECTION — Records by default, List with search one tap away -->
      <div class="jbx-pick" id="jbx-pick"></div>
    </main>
    <div class="jbx-toast" id="jbx-toast" role="status" aria-live="polite"></div>
  </section>

  <!-- THE ARCADE (SW v254) — not a layout: a place, like the jukebox. Opened by the router's
       arcadeOpen (the 🕹️ door in every layout), closed by arcadeClose. The list renders
       from ARC_CABINETS (js/lobby/arcade.js). Styles: css/arcade.css, scoped under #screen-arcade.
       SW v257 "Arcade Floor" (spec § 3.1): the marquee, a row of little cabinets (one per
       game, the controller's colours) that swipes and snaps, the position strip, PRESS START.
       Fixed 100dvh — only the row moves. -->
  <section id="screen-arcade" class="arc" style="display:none" aria-label="The Arcade">
    <header class="arc-head">
      <div class="arc-sign" aria-hidden="true">
        <span class="arc-sign-ear is-l"></span><span class="arc-sign-ear is-r"></span>
        <span class="arc-sign-face"><span class="arc-sign-text">The Arcade</span></span>
      </div>
      <h1 class="arc-sr">The Arcade</h1>
      <div class="arc-tools">
        <button class="btn-open-sound arc-icon" aria-label="Sound">🔊</button>
        <button id="btn-arc-close" class="arc-icon" aria-label="Leave the arcade">✕</button>
      </div>
    </header>
    <div class="arc-floor">
      <div id="arc-list" class="arc-track" role="group" aria-label="Cabinets"></div>
    </div>
    <div class="arc-strip">
      <div id="arc-scrub" class="arc-scrub" role="slider" tabindex="0" aria-label="Cabinet"></div>
      <p id="arc-count" class="arc-count" aria-hidden="true"></p>
    </div>
    <p id="arc-blurb" class="arc-sr" aria-live="polite"></p>
    <button id="btn-arc-start" class="arc-start">Press start</button>
  </section>

  <!-- The dock (DD-17): summoned, never automatic — the Lounge's channel dial and
       Original's layout button open it. Closed by the router's `home` and `closeSwitcher`. -->
  <div id="lobby-switcher-overlay" style="display:none"
    class="fixed inset-0 z-[90] overlay-modal-backdrop flex items-center justify-center px-6">
    <div class="overlay-modal-inner bg-stone-50 w-full max-w-sm rounded-3xl px-6 pt-6 pb-8 flex flex-col gap-4 text-center border border-stone-300">
      <h3 class="text-lg font-bold text-stone-800">Pick a layout</h3>
      <div id="lobby-switcher-list" class="grid grid-cols-2 gap-3"></div>
      <button id="btn-lobby-switcher-close"
        class="min-h-11 w-full rounded-2xl bg-stone-200 hover:bg-stone-300 active:scale-95 text-stone-700 font-semibold text-sm transition-transform duration-100">Not now</button>
    </div>
  </div>

  <!-- The stickerbook (the binder's door). stickerbook.js owns this node and
       toggles its own `hidden`, guarded by #stickerbook-overlay[hidden]{display:none!important}
       in css/lobby.css. Do NOT add it to resetToLobby()'s style.display list — an
       inline display:none would outlive the next open (spec § 3). -->
  <div id="stickerbook-overlay" hidden></div>

  <!-- Little Sylly's gallery: the two paintings on the Lounge wall open here. lobby-host.js
       (lobbyOpenPainting) owns it and toggles `hidden`; css/lobby.css guards [hidden]. Not in
       resetToLobby()'s display list, for the same reason as the stickerbook. -->
  <div id="painting-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="painting-title">
    <div class="pnt-stage">
      <div class="pnt">
        <button type="button" class="pnt-x" data-pnt="close" aria-label="Close the gallery">✕</button>
        <figure class="pnt-frame"><div class="pnt-mount"><img data-pnt="img" alt="" decoding="async"></div></figure>
        <aside class="pnt-plaque">
          <p class="pnt-eyebrow">Little Sylly's Gallery <span data-pnt="count"></span></p>
          <h2 id="painting-title" data-pnt="title"></h2>
          <p class="pnt-artist"><strong data-pnt="artist"></strong> · <span data-pnt="age"></span></p>
          <p class="pnt-medium" data-pnt="medium"></p>
          <p class="pnt-blurb" data-pnt="blurb"></p>
          <button type="button" class="pnt-next" data-pnt="next"></button>
        </aside>
      </div>
    </div>
  </div>
